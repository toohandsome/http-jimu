<el-dialog v-model="interceptorEditorVisible" :title="interceptorEditorTitle" width="78%" top="3vh" @close="disposeInterceptorEditors">
            <div style="display: flex; justify-content: space-between; margin-bottom: 10px;">
                <el-button-group>
                    <el-button size="small" @click="addInterceptorStepFromLibrary">从步骤库添加</el-button>
                </el-button-group>
                <el-dropdown @command="addInterceptorStep">
                    <el-button type="primary" size="small">新增自定义步骤</el-button>
                    <template #dropdown>
                        <el-dropdown-menu>
                            <el-dropdown-item command="SORT">参数排序 (SORT)</el-dropdown-item>
                            <el-dropdown-item command="SIGN">签名 (SIGN)</el-dropdown-item>
                            <el-dropdown-item command="ENCRYPT">加密 (ENCRYPT)</el-dropdown-item>
                            <el-dropdown-item command="ADD_FIXED">添加固定参数 (ADD_FIXED)</el-dropdown-item>
                            <el-dropdown-item command="SCRIPT">自定义脚本 (SCRIPT)</el-dropdown-item>
                        </el-dropdown-menu>
                    </template>
                </el-dropdown>
            </div>

            <div v-for="(step, index) in interceptorSteps" :key="'interceptor-' + index" class="step-item">
                <div class="step-header">
                    步骤 {{index + 1}}: {{step.type}}
                    <el-tag size="small" style="margin-left: 10px;">{{step.target || 'BODY'}}</el-tag>
                    <span v-if="step.stepCode" style="margin-left: 10px; color: #409eff;">(引用: {{step.stepCode}})</span>
                </div>
                <el-switch v-model="step.enableLog" active-text="日志" class="step-log-switch" size="small"></el-switch>
                <span class="step-delete" @click="interceptorSteps.splice(index, 1)">[删除]</span>

                <el-form-item label="作用对象" label-width="80px" v-if="!step.stepCode" style="margin-bottom: 10px;">
                    <el-radio-group v-model="step.target" size="small">
                        <el-radio-button label="BODY">请求体</el-radio-button>
                        <el-radio-button label="HEADER">请求头</el-radio-button>
                        <el-radio-button label="QUERY">查询参数</el-radio-button>
                        <el-radio-button label="FORM">表单</el-radio-button>
                        <el-radio-button label="RESPONSE_BODY">响应体</el-radio-button>
                        <el-radio-button label="RESPONSE_HEADER">响应头</el-radio-button>
                        <el-radio-button label="RESPONSE_STATUS">响应状态</el-radio-button>
                    </el-radio-group>
                </el-form-item>

                <div v-if="step.type === 'SIGN'">
                    <el-form-item label="算法" label-width="80px">
                        <el-select v-model="step.config.algorithm">
                            <el-option label="MD5" value="MD5"></el-option>
                            <el-option label="SHA256" value="SHA256"></el-option>
                        </el-select>
                    </el-form-item>
                    <el-form-item label="签名字段" label-width="80px">
                        <el-input v-model="step.config.targetField" placeholder="签名写入的字段名"></el-input>
                    </el-form-item>
                    <el-form-item label="盐值" label-width="80px">
                        <el-input v-model="step.config.salt" placeholder="盐值或 ${placeholder}"></el-input>
                    </el-form-item>
                </div>
                <div v-if="step.type === 'ENCRYPT'">
                    <el-form-item label="算法" label-width="80px">
                        <el-select v-model="step.config.algorithm">
                            <el-option label="HMAC_SHA256" value="HMAC_SHA256"></el-option>
                            <el-option label="HMAC_SHA1" value="HMAC_SHA1"></el-option>
                            <el-option label="AES_ECB_PKCS5" value="AES_ECB_PKCS5"></el-option>
                            <el-option label="AES_CBC_PKCS5" value="AES_CBC_PKCS5"></el-option>
                            <el-option label="RSA_ECB_PKCS1" value="RSA_ECB_PKCS1"></el-option>
                            <el-option label="RSA_SHA256_SIGN" value="RSA_SHA256_SIGN"></el-option>
                        </el-select>
                    </el-form-item>
                    <el-form-item label="字段" label-width="80px">
                        <el-input v-model="step.config.fields" placeholder="如：field1,field2（留空=整个载荷）"></el-input>
                    </el-form-item>
                    <el-form-item label="密钥" label-width="80px" v-if="step.config.algorithm && (step.config.algorithm.startsWith('HMAC') || step.config.algorithm.startsWith('AES'))">
                        <el-input v-model="step.config.secret" type="password" show-password placeholder="HMAC/AES 密钥，支持 ${placeholder}"></el-input>
                    </el-form-item>
                    <el-form-item label="IV" label-width="80px" v-if="step.config.algorithm === 'AES_CBC_PKCS5'">
                        <el-input v-model="step.config.iv" placeholder="16字节 IV，支持 ${placeholder}"></el-input>
                    </el-form-item>
                    <el-form-item label="公钥" label-width="80px" v-if="step.config.algorithm === 'RSA_ECB_PKCS1'">
                        <el-input type="textarea" :rows="3" v-model="step.config.publicKey" placeholder="-----BEGIN PUBLIC KEY----- ..."></el-input>
                    </el-form-item>
                    <el-form-item label="私钥" label-width="80px" v-if="step.config.algorithm === 'RSA_SHA256_SIGN'">
                        <el-input type="textarea" :rows="3" v-model="step.config.privateKey" placeholder="-----BEGIN PRIVATE KEY----- ..."></el-input>
                    </el-form-item>
                    <el-form-item label="输出编码" label-width="80px">
                        <el-select v-model="step.config.outputEncoding">
                            <el-option label="BASE64" value="BASE64"></el-option>
                            <el-option label="HEX" value="HEX"></el-option>
                        </el-select>
                    </el-form-item>
                    <el-form-item label="覆盖原字段" label-width="80px">
                        <el-switch v-model="step.config.overwrite"></el-switch>
                    </el-form-item>
                    <el-form-item label="目标字段" label-width="80px" v-if="step.config.overwrite === false">
                        <el-input v-model="step.config.targetField" placeholder="可选：输出字段名前缀"></el-input>
                    </el-form-item>
                </div>
                <div v-if="step.type === 'ADD_FIXED'">
                    <el-input type="textarea" v-model="step.config_json" :rows="2" placeholder='{"appId": "123"}' @blur="syncInterceptorStepJson(step)"></el-input>
                </div>
                <div v-if="step.type === 'SORT'">
                    <p style="font-size: 12px; color: #909399;">按键名进行字典序排序。</p>
                </div>
                <div v-show="step.type === 'SCRIPT' && !step.stepCode">
                    <div class="placeholder-tips">
                        可用变量：body、context、url、headers、queryParams、redis、log。<br>
                        示例：<code>headers.put("Auth", "123"); queryParams.put("k", "v"); return body;</code>
                    </div>
                    <div style="margin-bottom: 8px;">
                        <el-button size="small" type="primary" plain @click="validateInterceptorScriptStep(index)">校验语法</el-button>
                    </div>
                    <div :id="'interceptor-editor-' + index" class="script-editor"></div>
                </div>
                <div v-if="step.stepCode">
                    <div class="placeholder-tips">覆盖默认配置（JSON）：</div>
                    <el-input type="textarea" v-model="step.config_json" :rows="2" placeholder='{"overrideKey": "value"}' @blur="syncInterceptorStepJson(step)"></el-input>
                </div>
            </div>

            <template #footer>
                <el-button @click="interceptorEditorVisible = false">取消</el-button>
                <el-button type="primary" @click="saveInterceptorEditor">保存拦截器</el-button>
            </template>
        </el-dialog>
