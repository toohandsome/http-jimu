<el-dialog v-model="stepLibraryVisible" title="积木库管理" width="85%" top="3vh">
            <div style="margin-bottom: 15px;">
                <el-button type="primary" @click="showStepEditDialog()">新步骤</el-button>
            </div>
            <el-table :data="stepLibrary" style="width: 100%" border size="small" @row-dblclick="showStepEditDialog">
                <el-table-column prop="code" label="编码" width="150"></el-table-column>
                <el-table-column prop="name" label="名称" width="200"></el-table-column>
                <el-table-column prop="type" label="类型" width="100"></el-table-column>
                <el-table-column prop="target" label="作用" width="100">
                    <template #default="scope">
                        <el-tag :type="scope.row.target === 'BODY' ? 'info' : 'warning'" size="small">{{ scope.row.target || 'BODY' }}</el-tag>
                    </template>
                </el-table-column>
                <el-table-column prop="description" label="描述" show-overflow-tooltip></el-table-column>
                <el-table-column label="操作" width="150">
                    <template #default="scope">
                        <el-button size="small" @click="showStepEditDialog(scope.row)">编辑</el-button>
                        <el-button size="small" type="danger" @click="deleteStep(scope.row)">删除</el-button>
                    </template>
                </el-table-column>
            </el-table>
        </el-dialog>
